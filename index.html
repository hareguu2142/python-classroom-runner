<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="설치 없이 브라우저에서 바로 실행하는 수업용 Python 실습기">
  <title>파이썬 교실</title>
  <script>
    try {
      if (localStorage.getItem("python-classroom-runner:theme") === "dark") document.documentElement.dataset.theme = "dark";
    } catch { /* 저장된 테마가 없으면 밝은 테마로 시작합니다. */ }
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
  <link rel="stylesheet" href="./style.css?v=8">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="파이썬 교실 홈">
      <span class="brand-mark" aria-hidden="true">Py</span>
      <strong>파이썬 교실</strong>
    </a>
    <div class="header-tools">
      <div class="runtime-state" id="runtime-state" data-state="loading" aria-live="polite">
        <span class="state-dot"></span>
        <span id="runtime-label">준비 중…</span>
      </div>
      <div class="font-size-control" role="group" aria-label="글자 크기">
        <button id="font-size-decrease" type="button" aria-label="글자 작게" title="글자 작게">A−</button>
        <output id="font-size-value" for="font-size-decrease font-size-increase" aria-live="polite">100%</output>
        <button id="font-size-increase" type="button" aria-label="글자 크게" title="글자 크게">A+</button>
      </div>
      <button class="button button-plain" id="theme-toggle" type="button" title="화면 테마 바꾸기">어둡게</button>
    </div>
  </header>

  <main class="workspace" aria-label="Python 코드 실습기">
    <article class="panel editor-panel">
      <div class="panel-header">
        <div class="editor-tools">
          <span class="panel-title" id="file-name">main.py</span>
          <select id="example-select" aria-label="예제">
            <option value="" disabled selected>예제</option>
          </select>
          <details class="menu" id="file-menu">
            <summary class="button button-plain">파일</summary>
            <div class="menu-list">
              <button id="open-button" type="button">열기 (.py)</button>
              <input id="py-file-input" type="file" accept=".py,text/x-python" hidden>
              <button id="save-button" type="button">저장 (.py)</button>
              <button id="file-button" type="button">TXT·CSV 추가</button>
              <input id="file-input" type="file" accept=".txt,.csv,text/plain,text/csv" multiple hidden>
              <button id="reset-button" type="button">처음으로</button>
            </div>
          </details>
        </div>
        <div class="editor-actions">
          <button class="button button-plain" id="back-button" type="button" disabled title="이전 줄로 (Shift+F10 · Alt+↑)">이전</button>
          <button class="button button-plain" id="step-button" type="button" disabled title="한 줄 실행 (F10 · Alt+↓)">한 줄</button>
          <button class="button button-plain" id="cursor-button" type="button" disabled title="커서 줄까지 실행 (Ctrl+F10 · Alt+→)">커서까지</button>
          <button class="button button-plain" id="stop-button" type="button" disabled>중지</button>
          <button class="button button-run" id="run-button" type="button" disabled title="실행 (Ctrl+Enter)">▶ 실행</button>
        </div>
      </div>
      <div class="file-shelf" id="file-shelf" hidden>
        <div class="loaded-files" id="loaded-files" aria-live="polite"></div>
      </div>
      <div class="editor-wrap">
        <textarea id="code-editor" aria-label="Python 코드" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <span class="toast" id="save-status" role="status" hidden></span>
      </div>
    </article>

    <div class="side-column">
      <article class="panel output-panel" id="output-panel">
        <div class="panel-header compact">
          <span class="panel-title">결과</span>
          <div class="output-meta">
            <span id="elapsed-time"></span>
            <button class="icon-button" id="clear-button" type="button" aria-label="결과 지우기">지우기</button>
            <button class="icon-button" id="copy-button" type="button" aria-label="결과 복사">복사</button>
          </div>
        </div>
        <div class="terminal">
          <pre id="output" tabindex="0" aria-live="polite"></pre>
          <form class="terminal-input" id="terminal-input" hidden>
            <span class="terminal-chevron" aria-hidden="true">›</span>
            <label class="sr-only" for="terminal-input-value">프로그램 입력</label>
            <input id="terminal-input-value" type="text" autocomplete="off" spellcheck="false" placeholder="입력 후 Enter">
            <button type="submit">입력</button>
          </form>
        </div>
      </article>

      <article class="panel debug-panel">
        <div class="panel-header compact">
          <span class="panel-title">변수</span>
          <span class="debug-location" id="debug-location"></span>
        </div>
        <div class="variables" id="variables"></div>
      </article>
    </div>
  </main>

  <footer>Pyodide · CodeMirror</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.min.js"></script>
  <script type="module" src="./app.js?v=7"></script>
</body>
</html>
